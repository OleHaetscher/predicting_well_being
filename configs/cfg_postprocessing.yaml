# Supplementary Data files (src/create_supplementary_data.py). Tables not listed under mi_tables are read from
# the SI docx passed on the command line.
create_supplementary_data:
  output_dir: "../results/supplementary_data"
  max_file_size_mb: 30  # editor's limit per file
  descriptives_tables: [S18]  # docx tables whose section rows become a Section column
  corrections:  # cells empty in the docx: R2 table: [key column, key value, column to fill, value]
    S8:
      - [Variable Name, mean_time_bicycle, Sub-group, Activity]
      - [Variable Name, sd_time_bicycle, Sub-group, Activity]
      - [Variable Name, min_time_bicycle, Sub-group, Activity]
      - [Variable Name, max_time_bicycle, Sub-group, Activity]
  mi_tables:  # R2 table: directory and file suffix of the stored measurement invariance results
    S20: {dir: mi_across_datasets, suffix: ""}
    S21: {dir: mi_across_countries, suffix: "__100"}
    S22: {dir: mi_across_countries, suffix: "__150"}
    S23: {dir: mi_across_countries, suffix: "__200"}
  mi_blocks:  # result file: block label in the table
    state_wb_items: EWB
    trait_wb_items: RWB
    trait_features: Predictor variables
  mi_min_items: 3  # "Analyses were limited to constructs with >= 3 items" (SI table notes)
  mi_column_names:  # column in the stored results: column in the table
