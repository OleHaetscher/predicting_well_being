    S34: {performance: final_results/cv_results_pa_trait_selected_main.xlsx}
    S35: {performance: final_results/cv_results_pa_trait_all_main.xlsx}
    S36: {performance: final_results/cv_results_na_trait_selected_main.xlsx}
