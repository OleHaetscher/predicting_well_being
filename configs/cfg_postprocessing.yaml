# This configuration file enables the configuration of certain parameters for the postprocessing of the results.
# All final results where generated with the current configuration.

execute_postprocessing: true

methods_to_apply:
  #- condense_cv_results
  #- prediction_sanity_checks
  #- create_cv_results_plots
  #- conduct_significance_tests
  - create_cv_results_plots
  #- create_shap_plots
  #- calculate_exp_lin_models
  #- create_lin_model_coefs_supp
  #- create_shap_values_supp  # this may take a while
  #- create_shap_ia_values_supp
  #- test_measurement_invariance
  #- analyze_samples_missings
  #- shap_sanity_checks  # corr selected/all

general:
  feature_combinations:
    name_mapping:
      main:  # Note: Remove -lv for Paper CV_Result_Plot and SHAP plot due to reviewer comment
        pl: "Person"
        srmc: "Situation (ESM)"
        sens: "Situation (Sensing)"
        mac: "Country"
        pl_srmc: "Person + Situation (ESM)"
        pl_sens: "Person + Situation (Sensing)"
        pl_srmc_sens: "Person + Situation (ESM) + Situation (Sensing)"
        pl_mac: "Person + Country"
        pl_srmc_mac: "Person + Situation (ESM) + Country"
        all_in: "Person + Situation (ESM) + Situation (Sensing) + Country"

      supp:
        # As currently implemented, do only include 1x Supp analysis and comment the other out, not ideal but ok

        # Without neuroticism facets and self-esteem
        pl_nnse: "Person-lv without neuroticism facets and self-esteem"
        pl_srmc_nnse: "Person-lv + Situation-lv (ESM) without neuroticism facets and self-esteem"
        pl_sens_nnse: "Person-lv + Situation-lv (Sensing) without neuroticism facets and self-esteem"
        pl_srmc_sens_nnse: "Person-lv + Situation-lv (ESM) + Situation-lv (Sensing) without neuroticism facets and self-esteem"
        pl_mac_nnse: "Person-lv + Country-lv without neuroticism facets and self-esteem"
        pl_srmc_mac_nnse: "Person-lv + Situation-lv (ESM) + Country-lv without neuroticism facets and self-esteem"
        all_in_nnse: "Person-lv + Situation-lv (ESM) + Situation-lv (Sensing) + Country-lv without neuroticism facets and self-esteem"

        # Without personality, could adjust the dict items for table description, e.g., "peron-lv without personality"
        pl_npers: "Person-lv"
        pl_srmc_npers: "Person-lv + Situation-lv (ESM)"
        pl_sens_npers: "Person-lv + Situation-lv (Sensing)"
        pl_srmc_sens_npers: "Person-lv + Situation-lv (ESM) + Situation-lv (Sensing)"
        pl_mac_npers: "Person-lv + Country-lv"
        pl_srmc_mac_npers: "Person-lv + Situation-lv (ESM) + Country-lv"
        all_in_npers: "Person-lv + Situation-lv (ESM) + Situation-lv (Sensing) + Country-lv"

        # Alternative imputations
        pl_altimp: "Person-lv alternative imputations"
        srmc_altimp: "Situation-lv (ESM) alternative imputations"
        sens_altimp: "Situation-lv (Sensing) alternative imputations"
        mac_altimp: "Country-lv alternative imputations"
        pl_srmc_altimp: "Person-lv + Situation-lv (ESM) alternative imputations"
        pl_sens_altimp: "Person-lv + Situation-lv (Sensing) alternative imputations"
        pl_srmc_sens_altimp: "Person-lv + Situation-lv (ESM) + Situation-lv (Sensing) alternative imputations"
        pl_mac_altimp: "Person-lv + Country-lv alternative imputations"
        pl_srmc_mac_altimp: "Person-lv + Situation-lv (ESM) + Country-lv alternative imputations"
        all_in_altimp: "Person-lv + Situation-lv (ESM) + Situation-lv (Sensing) + Country-lv alternative imputations"

      ia_values:
        srmc_ia_values: "Situation (ESM): Interaction Values"

  samples_to_include:
    name_mapping:
      all: "All datasets"
      selected: "Reduced datasets"
      control: "Control datasets"

  crits:
    name_mapping:
      wb_state: "Experienced well-being"
      wb_trait: "Remembered well-being"
      pa_state: "Experienced positive affect"
      na_state: "Experienced negative affect"
      pa_trait: "Remembered positive affect"
      na_trait: "Remembered positive affect"

  models:
    name_mapping:
      elasticnet: ENR
      randomforestregressor: RFR

  metrics:
    name_mapping:
      pearson: r
      r2: R2
      spearman: rho
      neg_mean_squared_error: MSE

  processed_filenames:
    cv_results_summarized: "cv_results_summary.json"
    lin_model_coefs_summarized: "lin_model_coefs_summary.json"
    shap_values_summarized: "shap_values_summary.pkl"
    shap_ia_values_summarized: "shap_ia_values_summary.pkl"
    state_files_base_name: wb_items
    trait_files_base_name: trait_wb_items

  data_paths:
    base_path: "../results/"
    main_results: final_results  # cluster_results This should correspond to the base output path from cfg_analysis.yaml or the path defined in the SLURM script
    ia_values: ia_values_0912
    sig_tests: sig_tests_1312
    pred_vs_true: mac_pred_true
    plots: plots
    descriptives: descriptives

  figure_style:  # Nature Research artwork guide: Arial, editable text in vector PDF
    apply: true  # false: matplotlib defaults (DejaVu Sans, Type 3), as in the versions before Nature Communications
    font_family: Arial
    pdf_fonttype: 42

  global_plot_params:
    custom_cmap_colors:
      - "#5E9ACC"  # Blue
      - "#4F84B1"  # Deep blue
      - "#9DB9BF"  # Soft gray-blue
      - "#7DA5A9"  # Muted teal
      - "#B9D1B9"  # Light green
      - "#A3C7A1"  # Green
      - "#E3EEE5"  # Very pale green
      - "#CEE7CF"  # Light mint


# Method-specific configurations
condense_cv_results:
  decimals: 3
  negate_mse: true
  add_other_sds: true
  metrics:
    - pearson
    - r2
    - spearman
    - neg_mean_squared_error
  all_results:
    store: false
    filename: "all_cv_results.json"

  main_nnse_diffs:
    run: false   # Note: Not tested on final version
    crits: [ wb_state, wb_trait ]
    samples_to_include: [ selected ]
    metrics: [ pearson, r2 ]
    decimals: 3
    store: false
    filename: "main_nnse_diffs.json"

  perf_increase:
    calculate: false
    crits: [ wb_state, wb_trait ]
    samples_to_include: [ all, selected ]
    metrics: [ r2 ]
    models: [ randomforestregressor, elasticnet ]
    decimals: 3
    fc_to_compare:
      - [pl, pl_srmc_mac]
      - [pl_npers, pl_srmc_mac_npers]
    store: true
    filename: "perf_increase_percent.json"

  result_table:
    store: false
    file_base_name: cv_results
    result_strs:
      main: main
      supp: npers  # not used ATM, assigned dynamically
    mapping:
      feature_combination: "Predictor configuration"
      model: "Prediction model"
      metric: "Performance metric"

sanity_check_pred_vs_true:
  reps_to_check: [0, 1]

  plot:
    store: false
    filename: pred_true_parity_plot
    figure:
      width: 8
      height: 8
    xlabel: "True value"
    ylabel: "Predicted value"
    base_title: "Pred vs True"

  summary_stats:
    store: true
    filename: "pred_true_parity_summary.json"
    decimals: 4

create_descriptives:
  states_base_filename: wb_items
  traits_base_filename: trait_wb_items

  compute_predictor_rel:
    store: true
    filename: "predictor_reliabilities.xlsx"
    decimals: 2

  m_sd_table:
    store: false
    filename: "vars_m_sd_table.xlsx"
    decimals: 2
    store_index: false
    cont_agg_dct: { mean: M, std: SD }
    bin_agg_lst: [ "%" ]
    vars_to_include:
      - pl
      - srmc
      - sens
      - mac
      - crit
  soc_dem:
    store: false
    filename: "age_gender_per_dataset.json"

  # country var supp. figure
  country_vars:
    store: false
    filename: "country_add_descriptives.xlsx"
    store_plot: true
    plot_filename: "country_level_variability_top_n"

    plot_top_n: 6
    top_n_to_plot:
      - youth_unemployment
      - adult_unemployment
      - shortterm_orientation
      - gdp_growth
      - inflation_rate
      - poverty_rate

    n_cols: 3
    n_rows: 2

    show_legend: false
    show_configured_min_max_points: false
    plot_percentile: true
    percentile: 0.95

    reference_data:
      use: true
      path: "../data/top6_countries_alldata.xlsx"
      sheet_name: 0
      plot_all_points: true
      highlight_own_points: true

      variable_mapping:
        adult_unemployment: "unemployment_rate"
        youth_unemployment: "youth_unemployment_rate"

    scale_boundaries:
      youth_unemployment:
        unit: "% of labor force ages 15-24"
        min_country:
          name: "Tanzania"
          value: 3.49
          year: 2023
        max_country:
          name: "South Africa"
          value: 49.866
          year: 2021
        x_min: 0
        x_max: 60
        show_min_max_points: false  # optional per-variable override

      adult_unemployment:
        unit: "% of labor force"
        min_country:
          name: "Qatar"
          value: 0.13
          year: 2022
        max_country:
          name: "Eswatini"
          value: 35.359
          year: 2022
        x_min: 0
        x_max: 40
        show_min_max_points: false  # optional per-variable override

      shortterm_orientation:
        unit: "Hofstede long-term orientation score"
        min_country:
          name: "Puerto Rico"
          value: 0
          year: "static/source score"
        max_country:
          name: "South Korea"
          value: 100
          year: "static/source score"
        x_min: 0
        x_max: 100
        show_min_max_points: false  # optional per-variable override

      gdp_growth:
        unit: "annual GDP growth, %"
        min_country:
          name: "Macao SAR, China"
          value: -54.402
          year: 2020
        max_country:
          name: "Macao SAR, China"
          value: 75.308
          year: 2023
        x_min: -25
        x_max: 25
        show_min_max_points: false  # optional per-variable override

      inflation_rate:
        unit: "annual CPI inflation, %"
        min_country:
          name: "South Sudan"
          value: -6.687
          year: 2022
        max_country:
          name: "Zimbabwe"
          value: 557.202
          year: 2020
        x_min: -20
        x_max: 50
        show_min_max_points: false  # optional per-variable override

      poverty_rate:
        unit: "% of population below $2.15/day, 2017 PPP"
        source_scope: "World Bank WDI / Poverty and Inequality Platform; international extreme poverty line"
        indicator_code: "SI.POV.DDAY"
        indicator_name: "Poverty headcount ratio at $2.15 a day (2017 PPP) (% of population)"
        min_country:
          name: "multiple countries"
          value: 0.0
          year: "varies"
        max_country:
          name: "Zambia"
          value: 64.3
          year: 2022
        x_min: 0
        x_max: 70
        show_min_max_points: false  # optional per-variable override

  wb_items:  # to ensure consistent tables
    store: false
    filename: "wb_items_descriptive_table.xlsx"
    decimals: 2

    state_order:
      - Enthusiastic
      - Excited
      - Happy
      - Relaxed
      - Valence
      - Angry
      - Anxious
      - Sad
      - Worried

    trait_order:
      - Enthusiastic
      - Excited
      - Happy
      - Relaxed
      - Valence
      - Angry
      - Anxious
      - Sad
      - Worried

  rel:
    store: false
    filename: "crit_rel_per_sample.json"
    decimals: 2
    state:
      n_per_person_col_name: measures_per_person
      id_name: joint_user_id
      crits:
          - wb_state
          - pa_state
          - na_state

conduct_significance_tests:
  cv_results_matching_pattern: "cv_results_rep_\\d+\\.json"
  metric: r2
  crit: wb_state
  decimals: 3
  delta_r2_str: delta_R2
  t_strng: t
  p_strng: p
  p_fdr_strng: "p (FDR-corrected)"
  d_strng: d
  d_lower_strng: "95% CI lower bound"
  d_higher_strng: "95% CI higher bound"

  compare_models:
    store: true # true
    filename_compare_models_main: "sig_tests_compare_models_main.xlsx"
    filename_compare_models_control: "sig_tests_compare_models_control.xlsx"
    stat_order:
      - "M (SD) ENR"
      - "M (SD) RFR"
      - delta_R2
      - t
      - p
      - "p (FDR-corrected)"
      - d
      - "95% CI lower bound"
      - "95% CI higher bound"

  compare_predictor_classes:
    store: true # true
    filename_compare_predictor_classes: "sig_tests_compare_predictor_classes.xlsx"
    ref_predictor_class: "pl"
    stat_order:
      - "M (SD) Personal"
      - "M (SD) Other"
      - delta_R2
      - t
      - p
      - "p (FDR-corrected)"
      - d
      - "95% CI lower bound"
      - "95% CI higher bound"
    feature_combinations_included:
      - pl
      - pl_srmc
      - pl_sens
      - pl_srmc_sens
      - pl_mac
      - pl_srmc_mac

create_cv_results_plots:
  crits: [ wb_state ] # must be iterable
  samples_to_include: [ combo ]  # all / selected / combo, must be iterable
  metrics: [ pearson ]  # must be iterable
  m_metric: M
  sd_metric: SD
  models:
    - elasticnet
    - randomforestregressor
  plot_type: box  # bar: M with SD error bars (versions before Nature Communications); box: fold-level distributions

  box_params:  # only used if plot_type is box
    add_bar: true  # bar from zero to the mean below the box plot (box face left open)
    bar_height_frac: 0.9  # bar height as fraction of bar_width (as high as the box plots, as in the article)
    bar_alpha_factor: 0.55  # lighter bars: multiplies color_dct.bar_saturation
    whis: 1.5  # whiskers: most extreme value within 1.5 x IQR from the box
    box_height_frac: 0.9  # box height as fraction of bar_width
    linewidth: 0.5
    jitter_frac: 0.8  # vertical jitter of the points as fraction of the box height
    point_size: 1.2
    point_alpha: 0.45
    point_color: "#555555"  # used if no point_colors entry applies
    point_colors:  # stronger hues of color_dct
      pl: "#2E6DA4"
      other: "#4E8F4B"
    point_edgecolor: black
    point_edgewidth: 0.1  # > 0 draws point outlines in point_edgecolor (article: 0.1)
    seed: 42
    mean_marker:
      add: false  # the bar end marks the mean
      marker: D
      size: 6
      facecolor: white
    split_bar: false  # panels b and c: true = bar blue up to the person-only mean, green increment; false = green bar
    ref_line:  # person-only model (all datasets) in panels b and c
      add: true
      span: column  # column: one line per model across the whole column; bar: a short line at each bar
      models: [ randomforestregressor ]  # span column: models with a line (ENR and RFR person-only means differ by 0.007)
      linestyle: "--"
      linewidth: 0.8
      length_frac: 1.0  # line length as fraction of bar_width (span: bar)
      legend_label: "Person predictors only\n(RFR, all datasets), mean"

  store_params:
    store: true
    dpi: 600
    format: pdf  # png, pdf
    name: Figure_2_ncomms  # cv_results

  titles:
    #- "a) One-level predictions"
    #- "b) Two-level predictions"
    #- "c) Three-level predictions"
    - "a  One-level predictions"
    - "b  Two-level predictions"
    - "c  Three-level predictions"

  col_assignment:  # This is only for main, need to be adjusted for supp
    first_col: [ pl, srmc, sens, mac ]
    second_col: [ pl_srmc, pl_sens, pl_srmc_sens, pl_mac ]
    third_col: [ pl_srmc_mac, all_in ]

    #first_col: [pl_npers, srmc, sens, mac]
    #second_col: [pl_srmc_npers, pl_sens_npers, pl_srmc_sens_npers, pl_mac_npers]
    #third_col: [pl_srmc_mac_npers, all_in_npers]

  figure_params:
    num_rows: 4
    num_cols: 3
    width: 7.087  # inches, 180 mm (two-column width); old: 20
    height: 4.33  # inches, 110 mm; old: 10
    x_min: -0.05  # fold-level r of the sensing models goes slightly below 0; old: 0
    x_max: 0.70
    add_n: False  # for paper version according to reviewer comment
    bar_width: 0.15
    bar_align: center
    bar_capsize: 5
    y_line:
      #x_pos: [ 0.09, 0.4073, 0.725 ]  # OLD positions (with Sens)
      auto: true  # true: one line per column at x = 0, positions computed from the axes (x_pos, y_pos ignored)
      #x_pos: [ 0.1075, 0.425, 0.7423 ]  # positions for the bar version (20 x 10 in)
      x_pos: [ 0.1075, 0.419, 0.731 ]  # positions for the box version at 180 x 110 mm
      y_pos: [ [ 0.10, 0.908 ], [ 0.10, 0.908 ], [ 0.5202, 0.908 ] ]
      linestyle: "-"
      linewidth: 1
      color: black
    manual_x_label:
      pos: [0.848, 0.482]
    title_pos: [ 0.365, 1 ]
    title_pad: 8  # old: 30
    empty_cells:
      - [ 3, 2 ]
      - [ 2, 2 ]
    tight_layout: [ 0.02, 0.02, 0.98, 0.98 ]

  format_bar_plot:
    xlabels:
      max_char_on_line: 14
      balance: false
      split_strng: ";"
      force_split_strng: true
    axes:
      yticks:
        which: major
        pad: 52  # old: 115 (at 18 pt)
        length: 0
      ylabels:
        hor_align: left
      xlabels:
        pad: 10
      xticks:
        decimals: 2
        leading_zero: true  # journal style (0.50); false: APA (.50)

  rel:
    color: black
    linestyle: "--"
    linewidth: 1.2
    base_label: "Reliability = "

  legend:
    model_legend:
      add: false  # Instead plot directly on the bars
      enr_color: lightgray
      enr_label: "ENR (Upper Bar)"
      rfr_color: gray
      rfr_label: "RFR (Lower Bar)"
    feature_combo_legend:
      add: true
      ref_label: "Person predictors"
      other_label: "Situation/Country predictors"
    legend_loc: "center"  # old: "lower right"
    legend_pos: [ 0.855, 0.27 ]  # figure coordinates, empty area below panel c; old: [ 0.955, 0.18 ]
    ncol: 1

  fontsizes:  # pt at final size (180 mm width); journal range 5 to 7 pt. Old: title 22, tick_params 18, legend 19, label 18
    title: 7
    tick_params: 6
    legend: 6
    label: 7
    bar_label: 5

  color_dct:
    pl: "#5E9ACC"
    other: "#A3C7A1"
    bar_saturation:
      elasticnet: 0.7
      randomforestregressor: 1

  ref_dct:
    samples_to_include: selected # all for combo
    feature_combo: pl

  n_samples:
    pl: 9118
    srmc: 9118
    sens: 1338
    mac: 4460
    pl_srmc: 10015
    pl_sens: 10015
    pl_srmc_sens: 10015
    pl_mac: 10015
    pl_srmc_mac: 10015
    all_in: 10015

create_shap_plots:
  analysis: main   # main, supp
  models: [ randomforestregressor]  # must be iterable
  crits: [ wb_state ] # must be iterable
  samples_to_include: [ selected ]   # must be iterable
  num_to_display: 6

  store_params:
    store: true
    dpi: 600
    format: pdf # pdf, png
    name: beeswarm

  col_assignment:  # This is only for main, need to be adjusted for supp
    first_col: [ pl, srmc, sens, mac ]
    second_col: [ pl_srmc, pl_sens, pl_srmc_sens, pl_mac ]
    third_col: [ pl_srmc_mac, all_in ]

    #first_col: [pl_npers, srmc, sens, mac]
    #second_col: [pl_srmc_npers, pl_sens_npers, pl_srmc_sens_npers, pl_mac_npers]
    #third_col: [pl_srmc_mac_npers, all_in_npers]

  figure_params:
    num_rows: 4
    num_cols: 3
    width: 7.087  # inches, 180 mm (two-column width); old: 30
    height: 7.283  # inches, 185 mm (max. height for a caption under 300 words); old: 42
    fix_x_lim: true
    x_lim: [ -0.8, 0.8 ]
    max_char_on_line_y_ticks: 36  # old: 25
    point_size: 1.5  # marker size of the beeswarm points; not set: shap default (16)
    subplot_adjustments:  # old (30 x 42 in): top 0.92, left 0.17, wspace 1.25, hspace 0.6, right 0.94
      top: 0.90
      bottom: 0.05
      left: 0.23
      wspace: 1.86
      hspace: 1.05
      right: 0.955
    empty_cells:
      - [ 2, 2 ]
      - [ 3, 2 ]

  ia_values:
    add: true
    position: [ 3, 2 ]
    feature_combination: srmc
    short_feature_names: True
    meta_stat_to_extract: top_interactions
    stat_to_extract: top_abs_interactions
    order_to_extract: 2
    num_to_extract: 6
    title_split_strng: ":"
    abbreviation: IA
    xlabel: "SHAP IA value (impact on model output)"

  fontsizes:  # pt at final size (180 mm width); journal range 5 to 7 pt. Old: main_title 28, title 26, others 22
    main_title: 7
    title: 6
    tick_params: 5
    x_label: 5
    y_label: 5

  titles:
    fontweight: bold
    max_char_on_line: 26
    split_strng: "+"
    add_n: True
    shap_values:
      #- "a) One-level predictions"
      #- "b) Two-level predictions"
      #- "c) Three-level predictions"
      - "a  One-level predictions"
      - "b  Two-level predictions"
      - "c  Three-level predictions"
    shap_ia_values:
      #- "d) Predictor interactions"
      - "d  Predictor interactions"
    line_dct:
      row_0: 4
      row_1: 5
      row_2: 4
      row_3: 3
    position:
      shap_values:  # old: x_pos 0.32, y_pos 1.35
        x_pos: 0.32
        y_pos: 1.62
        ha: center
        va: bottom
      shap_ia_values:  # old: x_pos 0.48, y_pos 1.31
        x_pos: 0.48
        y_pos: 1.55
        ha: center
        va: bottom

calculate_exp_lin_models:
  num_features: 6
  decimals: 3
  store: true
  store_raw: true  # also store unrounded statistics (CSV) and the statsmodels summary (TXT)
  p_format: journal  # journal: 0.040 / <0.001 (Nature Communications); apa: .040 / <.001
  base_filename: reg_table
  samples_to_include: [ selected ]  # must be iterable; all_in always uses all datasets
  crits: [ wb_state ]  # must be iterable
  model_for_features: [ randomforestregressor ]  # must be iterable

  imputation: # only the params that deviate from the general imputation params
    model: elasticnet  # linear imputer (Ridge with predictive mean matching, see Imputer._fit_linear_imputer)
    num_imputations: 1
    max_iter: 40  # imputation rounds (hard-coded to 1 in earlier versions of LinearRegressor)
    random_state: 42  # explicit seed; the single imputation uses random_state + 1
    percentage_of_features: 1
    n_features_thresh: 6

analysis_missings:
  to_exclude:
    - other
    - mac
  compare_missings:
    base_file_name: pairwise_missing_tests.xlsx
  compare_samples:
    base_file_name: ICCs.xlsx


# Numbering of the final Supplementary Information (Nature Communications). Not a method of main.py; read by
# src/create_source_data.py and src/create_supplementary_data.py. The code keys tables by their number in the
# revised submission (R2, S1 to S59); the tables under supplementary_data moved to Supplementary Data files,
# and the remaining tables are renumbered consecutively in their R2 order (S24 becomes 16).
si_numbering:
  n_tables_r2: 59
  prefix: S  # prefix of the final table and figure numbers: "S" gives "Supplementary Table S16", "" gives "16"
  supplementary_data:  # R2 table: Supplementary Data number (tables longer than one page, editor's request)
    S2: 1
    S8: 2
    S9: 3
    S18: 4
    S20: 5
    S21: 6
    S22: 7
    S23: 8

# Source Data file (src/create_source_data.py). Not a method of main.py. Reads only results/ (paths relative to
# general: data_paths: base_path). Supplementary items are keyed by their R2 numbers; the files are labeled with
# the final numbers (si_numbering). The settings of create_cv_results_plots and create_shap_plots are switched
# between runs, so the display items are specified here in full.
create_source_data:
  output_dir: "../results/source_data"
  dir_name: Source Data  # folder name and zip name required by the journal
  max_file_size_mb: 30  # editor's limit per file
  model_names: {elasticnet: ENR, randomforestregressor: RFR}
  fold_level_skip_dirs: [tables_old]  # directories in data_paths: sig_tests that hold no fold-level results
  feature_combinations:
    main: &sd_main [pl, srmc, sens, mac, pl_srmc, pl_sens, pl_srmc_sens, pl_mac, pl_srmc_mac, all_in]
    npers: &sd_npers [pl_npers, srmc, sens, mac, pl_srmc_npers, pl_sens_npers, pl_srmc_sens_npers, pl_mac_npers, pl_srmc_mac_npers, all_in_npers]
  figure_2:  # fold-level values from data_paths: sig_tests, M and SD from all_cv_results.json
    crit: wb_state
    metric: pearson  # metric of the M and SD sheet
    panels:  # panel: samples and feature combinations (as in create_cv_results_plots, samples_to_include: combo)
      a: {samples: selected, feature_combinations: [pl, srmc, sens, mac]}
      b: {samples: all, feature_combinations: [pl_srmc, pl_sens, pl_srmc_sens, pl_mac]}
      c: {samples: all, feature_combinations: [pl_srmc_mac, all_in]}
      reference line (b, c): {samples: all, feature_combinations: [pl]}
  figure_3:  # beeswarm panels a to c, interaction values panel d
    crit: wb_state
    samples: selected
    model: randomforestregressor
    feature_combinations: *sd_main
    ia_feature_combination: srmc
  supplementary_figures:  # R2 figure: beeswarm plot
    S1: {crit: wb_state, samples: all, model: randomforestregressor, feature_combinations: *sd_main}
    S2: {crit: wb_state, samples: selected, model: elasticnet, feature_combinations: *sd_main}
    S3: {crit: wb_state, samples: all, model: elasticnet, feature_combinations: *sd_main}
    S4: {crit: wb_trait, samples: selected, model: randomforestregressor, feature_combinations: *sd_main}
    S5: {crit: wb_trait, samples: all, model: randomforestregressor, feature_combinations: *sd_main}
    S6: {crit: wb_trait, samples: selected, model: elasticnet, feature_combinations: *sd_main}
    S7: {crit: wb_trait, samples: all, model: elasticnet, feature_combinations: *sd_main}
    S8: {crit: wb_state, samples: selected, model: randomforestregressor, feature_combinations: *sd_npers}
    S9: {crit: wb_state, samples: all, model: randomforestregressor, feature_combinations: *sd_npers}
    S10: {crit: wb_state, samples: selected, model: elasticnet, feature_combinations: *sd_npers}
    S11: {crit: wb_state, samples: all, model: elasticnet, feature_combinations: *sd_npers}
    S12: {crit: wb_trait, samples: selected, model: randomforestregressor, feature_combinations: *sd_npers}
    S13: {crit: wb_trait, samples: all, model: randomforestregressor, feature_combinations: *sd_npers}
    S14: {crit: wb_trait, samples: selected, model: elasticnet, feature_combinations: *sd_npers}
    S15: {crit: wb_trait, samples: all, model: elasticnet, feature_combinations: *sd_npers}
  supplementary_tables:  # R2 table: {sheet name: result file}
    S24: {performance: final_results/cv_results_wb_state_selected_main.xlsx}
    S25: {performance: final_results/cv_results_wb_state_all_main.xlsx}
    S26: {tests: sig_tests_1312/sig_tests_compare_predictor_classes.xlsx}
    S27: {tests: sig_tests_1312/sig_tests_compare_models_main.xlsx}
    S28: {performance: final_results/cv_results_wb_trait_selected_main.xlsx}
    S29: {performance: final_results/cv_results_wb_trait_all_main.xlsx}
    S30: {performance: final_results/cv_results_pa_state_selected_main.xlsx}
    S31: {performance: final_results/cv_results_pa_state_all_main.xlsx}
    S32: {performance: final_results/cv_results_na_state_selected_main.xlsx}
